[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moonbow"
version = "0.1.0"
description = "Moonbow: in-harness NLP stream pipelines of narrow-band micro-models for agent metacognition (includes the Progress Guard closure gate)"
readme = "README.md"
authors = [
    { name = "Nuctori" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
moonbow = "moonbow.cli:main"
progress-guard = "moonbow.guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
moonbow = [
    "extensions/*",
    "models/**/*",
    "skills/**/*",
]
